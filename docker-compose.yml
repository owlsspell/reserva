services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slotly
      POSTGRES_PASSWORD: slotly
      POSTGRES_DB: slotly
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slotly']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit: # local SMTP + web UI on http://localhost:8025
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']

  stripe-cli: # forwards Stripe test webhooks to the API: docker compose --profile stripe up
    image: stripe/stripe-cli
    profiles: ['stripe']
    command: listen --api-key ${STRIPE_SECRET_KEY} --forward-to host.docker.internal:3000/api/v1/webhooks/stripe
    extra_hosts: ['host.docker.internal:host-gateway']

volumes:
  pgdata:

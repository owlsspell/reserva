services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reserva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reserva
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reserva']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reserva_test_db
      POSTGRES_PASSWORD: test
      POSTGRES_DB: reserva_test_db
    ports: ['5433:5432']
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reserva_test_db -d reserva_test_db']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit: # local SMTP + web UI on http://localhost:8025
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']

  stripe-cli: # forwards Stripe test webhooks to the API: docker compose --profile stripe up
    image: stripe/stripe-cli
    profiles: ['stripe']
    command: listen --api-key ${STRIPE_SECRET_KEY} --forward-to host.docker.internal:3000/api/v1/webhooks/stripe
    extra_hosts: ['host.docker.internal:host-gateway']

volumes:
  pgdata:

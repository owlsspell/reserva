name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: reserva, POSTGRES_PASSWORD: reserva, POSTGRES_DB: reserva }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reserva" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres_test:
        image: postgres:16-alpine
        env:
          { POSTGRES_USER: reserva_test_db, POSTGRES_PASSWORD: test, POSTGRES_DB: reserva_test_db }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U reserva_test_db -d reserva_test_db" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://reserva:reserva@localhost:5432/reserva
      DATABASE_URL_TEST: postgresql://reserva_test_db:test@localhost:5433/reserva_test_db
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: change-me-access-min-32-chars-long
      JWT_REFRESH_SECRET: change-me-refresh-min-32-chars-long
      STRIPE_SECRET_KEY: sk_test_xxx
      STRIPE_WEBHOOK_SECRET: whsec_xxx
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm prisma migrate deploy
      - name: Migrate test DB
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
      # - run: pnpm test:integration
      # - run: pnpm test:e2e
      - run: pnpm test:db:migrate
      - run: pnpm test:concurrency
      - name: OpenAPI drift check
        run: pnpm openapi:export && git diff --exit-code openapi.json
